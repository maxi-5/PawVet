# Contrato OpenAPI (diseno primero) - Hito 2, actualizado segun docs/openapi/CHANGELOG.md
openapi: 3.0.3
info:
  title: PawVet - API Clinica e Identidad
  version: 1.1.0
  description: Usuarios, roles y login (emite el JWT), tutores, mascotas, veterinarios, especies y razas. Base de datos PawVetClinicaDB.
    Roles por operacion en x-roles.
servers:
- url: http://localhost:5001/api/v1
  description: Local (dotnet run o docker compose)
tags:
- name: Autenticacion
- name: Usuarios
- name: Tutores
- name: Mascotas
- name: Veterinarios
- name: Catalogos
security:
- bearerAuth: []
paths:
  /auth/login:
    post:
      tags:
      - Autenticacion
      summary: Inicia sesion y entrega el JWT (60 min)
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Correcto
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          description: Datos invalidos o regla de negocio no cumplida
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ValidationProblemDetails'
        '401':
          description: Sin token, token invalido o vencido
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
          headers:
            WWW-Authenticate:
              schema:
                type: string
              description: Bearer error="invalid_token" cuando el token vencio
  /usuarios:
    get:
      tags:
      - Usuarios
      summary: Lista usuarios (paginado)
      operationId: listarUsuarios
      x-roles:
      - Administrador
      parameters:
      - name: pagina
        in: query
        required: false
        schema:
          type: integer
          default: 1
          minimum: 1
      - name: tamano
        in: query
        required: false
        schema:
          type: integer
          default: 20
          minimum: 1
          maximum: 100
      responses:
        '200':
          description: Correcto
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Pagina'
                - type: object
                  properties:
                    items:
                      type: array
                      items:
                        $ref: '#/components/schemas/Usuario'
        '401':
          description: Sin token, token invalido o vencido
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
          headers:
            WWW-Authenticate:
              schema:
                type: string
              description: Bearer error="invalid_token" cuando el token vencio
        '403':
          description: Rol sin permiso
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
    post:
      tags:
      - Usuarios
      summary: Crea un usuario con su rol (password con BCrypt)
      operationId: crearUsuario
      x-roles:
      - Administrador
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UsuarioCrear'
      responses:
        '201':
          description: Creado (encabezado Location)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Usuario'
          headers:
            Location:
              schema:
                type: string
              description: URL del recurso creado
        '400':
          description: Datos invalidos o regla de negocio no cumplida
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ValidationProblemDetails'
        '401':
          description: Sin token, token invalido o vencido
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
          headers:
            WWW-Authenticate:
              schema:
                type: string
              description: Bearer error="invalid_token" cuando el token vencio
        '403':
          description: Rol sin permiso
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '409':
          description: Conflicto (dato repetido, estado o dependencias)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /usuarios/{id}:
    parameters:
    - name: id
