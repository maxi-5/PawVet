components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT HS256 de 60 minutos emitido por POST /auth/login de la API Clinica
  schemas:
    ProblemDetails:
      type: object
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        traceId:
          type: string
      description: RFC 9457
    ValidationProblemDetails:
      allOf:
      - $ref: '#/components/schemas/ProblemDetails'
      - type: object
        properties:
          errors:
            type: object
            additionalProperties:
              type: array
              items:
                type: string
    Pagina:
      type: object
      properties:
        pagina:
          type: integer
        tamano:
          type: integer
        total:
          type: integer
    LoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          example: admin@pawvet.cl
        password:
          type: string
          example: Admin123!
      required:
      - email
      - password
    Usuario:
      type: object
      properties:
        idUser:
          type: integer
        nombre:
          type: string
        email:
          type: string
          format: email
        idRol:
          type: integer
        rol:
          type: string
          enum:
          - Administrador
          - Recepcionista
          - Veterinario
    LoginResponse:
      type: object
      properties:
        token:
          type: string
        expira:
          type: string
          format: date-time
        usuario:
          $ref: '#/components/schemas/Usuario'
        idVeterinario:
          type: integer
          nullable: true
          description: Solo si el usuario es Veterinario con ficha vinculada (claim id_veterinario)
    UsuarioCrear:
      type: object
      properties:
        nombre:
          type: string
          minLength: 3
          maxLength: 150
        email:
          type: string
          format: email
          maxLength: 150
        password:
          type: string
          minLength: 6
          maxLength: 100
        idRol:
          type: integer
      required:
      - nombre
      - email
      - password
      - idRol
    Rol:
      type: object
      properties:
        idRol:
          type: integer
        nombre:
          type: string
    Tutor:
      type: object
      properties:
        idTutor:
          type: integer
        rut:
          type: string
        nombre:
          type: string
        telefono:
          type: string
        email:
          type: string
          nullable: true
        direccion:
          type: string
          nullable: true
        cantidadMascotas:
          type: integer
    TutorGuardar:
      type: object
      properties:
        rut:
          type: string
          pattern: ^[0-9]{7,8}-[0-9Kk]$
          description: RUT chileno con digito verificador valido (modulo 11)
        nombre:
          type: string
          minLength: 3
          maxLength: 150
        telefono:
          type: string
          pattern: ^\+56[0-9]{9}$
          example: '+56912345678'
        email:
          type: string
          format: email
          nullable: true
        direccion:
          type: string
          maxLength: 200
          nullable: true
      required:
      - rut
      - nombre
      - telefono
    Mascota:
      type: object
      properties:
        idMascota:
          type: integer
        nombre:
          type: string
        sexo:
          type: string
          enum:
          - Macho
          - Hembra
        fechaNacimiento:
          type: string
          format: date
          nullable: true
        edad:
          type: integer
          nullable: true
          description: Mascota.calcularEdad()
        peso:
          type: number
          format: double
          nullable: true
        microchip:
          type: string
          nullable: true
        idTutor:
          type: integer
        nombreTutor:
          type: string
        idEspecie:
          type: integer
        especie:
          type: string
        idRaza:
          type: integer
          nullable: true
        raza:
          type: string
          nullable: true
    MascotaGuardar:
      type: object
      properties:
        nombre:
          type: string
          minLength: 2
          maxLength: 60
        sexo:
          type: string
          enum:
          - Macho
          - Hembra
        fechaNacimiento:
          type: string
          format: date
          nullable: true
          description: No puede ser futura (400)
        peso:
          type: number
          format: double
          minimum: 0.01
          maximum: 999.99
          nullable: true
        microchip:
          type: string
          pattern: ^[0-9]{15}$
          nullable: true
          description: Opcional; unico (409)
        idTutor:
          type: integer
        idEspecie:
          type: integer
        idRaza:
          type: integer
          nullable: true
          description: Debe pertenecer a la especie (400)
      required:
      - nombre
      - sexo
      - idTutor
      - idEspecie
    Veterinario:
      type: object
      properties:
        idVeterinario:
          type: integer
        rut:
          type: string
        nombre:
          type: string
        especialidad:
          type: string
          nullable: true
        telefono:
          type: string
          nullable: true
        email:
          type: string
          nullable: true
        idUser:
          type: integer
          nullable: true
    VeterinarioGuardar:
      type: object
      properties:
        rut:
          type: string
          pattern: ^[0-9]{7,8}-[0-9Kk]$
          description: RUT chileno con digito verificador valido (modulo 11)
        nombre:
          type: string
          minLength: 3
          maxLength: 150
        especialidad:
          type: string
          maxLength: 100
          nullable: true
        telefono:
          type: string
          pattern: ^\+56[0-9]{9}$
          example: '+56912345678'
          nullable: true
        email:
          type: string
          format: email
          nullable: true
        idUser:
          type: integer
          nullable: true
          description: Usuario con rol Veterinario (400); no vinculado a otra ficha (409)
      required:
      - rut
      - nombre
    Especie:
      type: object
      properties:
        idEspecie:
          type: integer
        nombre:
          type: string
    EspecieCrear:
      type: object
      properties:
        nombre:
          type: string
          minLength: 2
          maxLength: 50
      required:
      - nombre
    Raza:
      type: object
      properties:
        idRaza:
          type: integer
        nombre:
          type: string
        idEspecie:
          type: integer
        especie:
          type: string
    RazaCrear:
      type: object
      properties:
        nombre:
          type: string
          minLength: 2
          maxLength: 80
        idEspecie:
          type: integer
      required:
      - nombre
      - idEspecie
